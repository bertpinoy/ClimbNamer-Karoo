name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # create releases for tags
  packages: read    # download karoo-ext from GitHub Packages

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # karoo-ext is on GitHub Packages, which always requires a login.
      USERNAME: ${{ github.actor }}
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: sign releases with your own key. Add these repository secrets:
      # SIGNING_KEYSTORE_BASE64, SIGNING_KEYSTORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD.
      # Without them the APK is signed with a throw-away debug key.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/climbnamer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: climbnamer-apk
          path: dist/climbnamer.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CODE=$(grep -E 'versionCode *=' app/build.gradle.kts | grep -oE '[0-9]+')
          cat > dist/manifest.json <<EOF
          {
            "label": "ClimbNamer",
            "packageName": "io.github.bertpinoy.climbnamer",
            "latestApkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/climbnamer.apk",
            "latestVersion": "${VERSION}",
            "latestVersionCode": ${CODE},
            "developer": "bertpinoy",
            "description": "Names the climbs on your route (OpenStreetMap): data field, climb alerts and map labels. Not affiliated with Hammerhead or SRAM."
          }
          EOF
          gh release create "$GITHUB_REF_NAME" dist/climbnamer.apk dist/manifest.json --title "ClimbNamer $VERSION" --generate-notes
