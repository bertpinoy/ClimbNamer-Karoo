name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # create releases for tags
  packages: read    # download karoo-ext from GitHub Packages

jobs:
  build:
    # Pinned so a new Ubuntu image can't change the build unexpectedly; bump deliberately.
    runs-on: ubuntu-24.04
    env:
      # karoo-ext is on GitHub Packages, which always requires a login.
      USERNAME: ${{ github.actor }}
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # setup-java also caches Gradle dependencies (no need for gradle/actions,
      # whose v6 caching component has proprietary license terms).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Optional: sign releases with your own key. Add these repository secrets:
      # SIGNING_KEYSTORE_BASE64, SIGNING_KEYSTORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD.
      # Without them the APK is signed with a throw-away debug key.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/climbnamer.apk

      - uses: actions/upload-artifact@v7
        with:
          name: climbnamer-apk
          path: dist/climbnamer.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(grep -E 'versionName *=' app/build.gradle.kts | grep -oE '"[^"]+"' | tr -d '"')
          CODE=$(grep -E 'versionCode *=' app/build.gradle.kts | grep -oE '[0-9]+')
          if [ "$VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $APP_VERSION in app/build.gradle.kts"
            exit 1
          fi
          # Application manifest read by Karoo devices (Extension Library and update checks).
          jq -n \
            --arg version "$VERSION" \
            --argjson code "$CODE" \
            --arg apk "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/climbnamer.apk" \
            --arg icon "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/docs/icon-512.png" \
            --rawfile notes RELEASE_NOTES.md \
            '{
              label: "ClimbNamer",
              packageName: "io.github.bertpinoy.climbnamer",
              latestApkUrl: $apk,
              latestVersion: $version,
              latestVersionCode: $code,
              iconUrl: $icon,
              developer: "bertpinoy",
              description: "Names the climbs on the route you navigate, using OpenStreetMap: a \"Climb name\" data field, an alert when a climb starts, and summit labels on the map. Everything can be switched on or off. Not affiliated with Hammerhead or SRAM.",
              releaseNotes: ($notes | rtrimstr("\n")),
              tags: ["performance"]
            }' > dist/manifest.json
          cat dist/manifest.json
          gh release create "$GITHUB_REF_NAME" dist/climbnamer.apk dist/manifest.json \
            --title "ClimbNamer $VERSION" --notes-file RELEASE_NOTES.md
